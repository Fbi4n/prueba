{% extends "base.html" %}
{% block content %}
<main class="container py-5">
  <div class="row">
    <div class="col-md-4 offset-md-4">
      <form method="POST" class="card card-body">
        <h1 class="text-center">Signup Django App</h1>
        <p style="color: red">{{error}}</p>
        <p style="color: red">{{error1}}</p>
        {% csrf_token %} 
        <div class="mb-3">
            <label for="username">Username:</label>
            <input type="text" name="username" id="username" class="form-control" placeholder="Ingrese su usuario" required>
        </div>
        <div class="mb-3">
            <label for="password1">Password:</label>
            <input type="password" name="password1" id="password1" class="form-control" placeholder="Ingrese su contraseña" required>
        </div>
        <div class="mb-3">
            <label for="password2">Confirm password:</label>
            <input type="password" name="password2" id="password2" class="form-control" placeholder="Repita su contraseña" required>
        </div>
        <button class="btn btn-dark">Registrar</button>
      </form>
    </div>
  </div>
</main>
{% endblock content %}
